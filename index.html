<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12131f"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>魔法の旅のしおり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* レイアウト: 夜の城の中に羊皮紙のカードが浮かぶ、1 画面アプリ。下に 3 つのタブ。単一テーマ（夜）で固定 */
:root {
  color-scheme: dark;
  --night: #12131f;        /* 背景 */
  --night-2: #1c1e30;      /* 一段上の面 */
  --ink: #f1e9d6;          /* 夜の上の文字 */
  --ink-dim: #b7ad97;      /* 補助文字 */
  --gold: #d9b45a;         /* アクセント */
  --gold-deep: #9c7a2c;
  --parch: #efe3c4;        /* 羊皮紙 */
  --parch-ink: #2b2116;    /* 羊皮紙の上の文字 */
  --parch-dim: #6b5a43;
  --line: rgba(217, 180, 90, 0.28);
  /* 4 寮 */
  --gry: #a8242c; --gry-2: #e3b14a;
  --sly: #1f6b45; --sly-2: #c9ced6;
  --rav: #2b4c9a; --rav-2: #c6995a;
  --huf: #e2b52a; --huf-2: #2a2620;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --radius: 14px;
  --nav-h: 64px;
}
html, body { height: 100%; }
body {
  background: var(--night);
  background-image: radial-gradient(ellipse at 50% -10%, #2a2c4a 0%, transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 16px;
  background: rgba(18, 19, 31, 0.92);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.app-title {
  min-width: 0; margin: 0;
  font-family: var(--font-display); font-weight: 800; font-size: 18px;
  letter-spacing: 0.08em; color: var(--gold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.app-sub { flex-shrink: 0; white-space: nowrap; font-size: 12px; color: var(--ink-dim); }

main.view {
  max-width: 560px; margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(18, 19, 31, 0.97);
  border-top: 1px solid var(--line);
}
.tabbar button {
  min-width: 0; min-height: var(--nav-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: 0; cursor: pointer;
  color: var(--ink-dim); font-size: 12px; white-space: nowrap;
}
.tabbar button .ico { font-family: var(--font-display); font-size: 20px; line-height: 1; }
.tabbar button[aria-current="page"] { color: var(--gold); }

/* 共通部品（各モジュールが使ってよい） */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 10px 18px;
  border-radius: 999px; border: 1px solid var(--gold);
  background: var(--gold); color: var(--parch-ink);
  font-weight: 700; white-space: nowrap; cursor: pointer;
  flex-shrink: 0;
}
.btn.ghost { background: transparent; color: var(--gold); }
.btn:disabled { opacity: 0.4; cursor: default; }
.parchment {
  background: var(--parch); color: var(--parch-ink);
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 0 40px rgba(120, 85, 30, 0.18);
  padding: 20px 18px;
}
.h-display { font-family: var(--font-display); font-weight: 800; text-wrap: balance; letter-spacing: 0.04em; }
.muted { color: var(--ink-dim); }
.house-chip {
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; white-space: nowrap;
  padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
}
.house-chip[data-house="gryffindor"] { background: var(--gry); color: var(--gry-2); }
.house-chip[data-house="slytherin"]  { background: var(--sly); color: var(--sly-2); }
.house-chip[data-house="ravenclaw"]  { background: var(--rav); color: var(--rav-2); }
.house-chip[data-house="hufflepuff"] { background: var(--huf); color: var(--huf-2); }

.toast {
  position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%); z-index: 20;
  max-width: calc(100% - 32px);
  padding: 10px 16px; border-radius: 999px;
  background: var(--parch); color: var(--parch-ink); font-weight: 700; font-size: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="app-header">
  <h1 class="app-title">魔法の旅のしおり</h1>
  <span class="app-sub" id="app-sub">東京 → ユニバ</span>
</header>

<main class="view" id="view-hunt" data-tab="hunt"></main>
<main class="view" id="view-games" data-tab="games" hidden></main>
<main class="view" id="view-paper" data-tab="paper" hidden></main>

<nav class="tabbar" aria-label="メニュー">
  <button type="button" data-go="hunt"><span class="ico">✦</span>分霊箱ハント</button>
  <button type="button" data-go="games"><span class="ico">♣</span>飲みゲーム</button>
  <button type="button" data-go="paper"><span class="ico">✎</span>予言者新聞</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="core.js" charset="utf-8"></script>
<script src="sync.js" charset="utf-8"></script>
<script src="hunt.js" charset="utf-8"></script>
<script src="games.js" charset="utf-8"></script>
<script src="paper.js" charset="utf-8"></script>
<script>HP.start();</script>

</body></html>
