<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>魔法の旅のしおり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* デザイン: locore（Editorial Light / Locore Lime）を転用。
 * 白地 × インクの黒 × ライムの差し色。カードは 1px の罫線と弱い影、ボタンはピル。
 * 英字の小見出しは等幅＋字間広め。明朝は使わない。 */
:root {
  color-scheme: light;
  /* locore tokens */
  --lc-bg: #FFFFFF;
  --lc-surface: #FFFFFF;
  --lc-muted: #F4F4F5;
  --lc-border: #E3E3DA;
  --lc-border-strong: #CCCCC1;
  --lc-fg: #18181b;
  --lc-fg-2: #3f3f46;
  --lc-fg-muted: #71717a;
  --lc-fg-subtle: #837f78;
  --lime: #A8E01C;
  --lime-300: #B6E84E;
  --lime-200: #CDF088;
  --lime-100: #E3F7B8;
  --lime-50: #F5FBE2;
  --lime-700: #5E8B0E;
  --lime-900: #3D5E07;
  --danger: #dc2626;
  --shadow-xs: 0 1px 2px rgba(24,24,27,.04);
  --shadow-sm: 0 2px 6px rgba(24,24,27,.06);
  --shadow-md: 0 6px 16px rgba(24,24,27,.08);
  --shadow-lg: 0 16px 32px rgba(24,24,27,.12);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --font-jp: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic Medium", sans-serif;
  --font-latin: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace;

  /* 旧トークン（各画面が参照）を locore の色に読み替える */
  --night: var(--lc-bg);
  --night-2: var(--lc-muted);
  --ink: var(--lc-fg);
  --ink-dim: var(--lc-fg-muted);
  --gold: var(--lime-700);
  --gold-deep: var(--lime-900);
  --parch: var(--lc-surface);
  --parch-ink: var(--lc-fg);
  --parch-dim: var(--lc-fg-muted);
  --line: var(--lc-border);
  /* 4 寮（彩度を落として白地になじませる） */
  --gry: #9b2c2c; --gry-2: #ffffff;
  --sly: #2f6b4f; --sly-2: #ffffff;
  --rav: #2f4a8a; --rav-2: #ffffff;
  --huf: #d9a91c; --huf-2: #18181b;
  --font-display: var(--font-jp);
  --font-body: var(--font-jp);
  --radius: 16px;
  --nav-h: 64px;
}
html, body { height: 100%; }
body {
  background: var(--lc-bg);
  color: var(--lc-fg);
  font-family: var(--font-jp);
  font-size: 16px;
  line-height: 1.75;
  font-feature-settings: "palt" 1;
  letter-spacing: .005em;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; }
h1, h2, h3, h4 { letter-spacing: -.01em; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

.app-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 16px;
  background: rgba(255,255,255,.92);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--lc-border);
}
.app-title {
  min-width: 0; margin: 0; display: flex; align-items: center; gap: 8px;
  font-family: var(--font-jp); font-weight: 700; font-size: 16px; letter-spacing: -.01em; color: var(--lc-fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.app-title::before { content: ""; flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px var(--lime-100); }
.app-sub { flex-shrink: 0; white-space: nowrap; font-size: 12px; color: var(--lc-fg-muted); }

main.view {
  max-width: 560px; margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--lc-border);
}
.tabbar button {
  position: relative; min-width: 0; min-height: var(--nav-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: none; border: 0; cursor: pointer;
  color: var(--lc-fg-muted); font-size: 11px; font-weight: 500; white-space: nowrap;
}
.tabbar button .ico { font-size: 18px; line-height: 1; }
.tabbar button[aria-current="page"] { color: var(--lc-fg); font-weight: 700; }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--lime); }

/* 共通部品（各モジュールが使ってよい） */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 10px 22px;
  border-radius: 9999px; border: 1px solid var(--lime);
  background: var(--lime); color: #0e0e0f;
  font-weight: 700; font-size: 15px; white-space: nowrap; cursor: pointer;
  flex-shrink: 0; box-shadow: var(--shadow-sm);
  transition: transform .12s var(--ease-out), background .2s;
}
.btn:active { transform: scale(.97); }
.btn.ghost { background: #fff; color: var(--lc-fg-2); border-color: var(--lc-border-strong); box-shadow: none; }
.btn:disabled { opacity: .4; cursor: default; }
.parchment {
  background: var(--lc-surface); color: var(--lc-fg);
  border: 1px solid var(--lc-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 20px 18px;
}
.h-display { font-family: var(--font-jp); font-weight: 700; text-wrap: balance; letter-spacing: -.015em; }
.muted { color: var(--lc-fg-muted); }
.eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--lime-700); }
.house-chip {
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; white-space: nowrap;
  padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: 700;
}
.house-chip[data-house="gryffindor"] { background: var(--gry); color: var(--gry-2); }
.house-chip[data-house="slytherin"]  { background: var(--sly); color: var(--sly-2); }
.house-chip[data-house="ravenclaw"]  { background: var(--rav); color: var(--rav-2); }
.house-chip[data-house="hufflepuff"] { background: var(--huf); color: var(--huf-2); }

.toast {
  position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%); z-index: 40;
  max-width: calc(100% - 32px);
  padding: 10px 18px; border-radius: 9999px;
  background: var(--lc-fg); color: #fff; font-weight: 600; font-size: 14px;
  box-shadow: var(--shadow-lg);
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="app-header">
  <h1 class="app-title">魔法の旅のしおり</h1>
  <span class="app-sub" id="app-sub">東京 → ユニバ</span>
</header>

<main class="view" id="view-hunt" data-tab="hunt"></main>
<main class="view" id="view-games" data-tab="games" hidden></main>
<main class="view" id="view-paper" data-tab="paper" hidden></main>

<nav class="tabbar" aria-label="メニュー">
  <button type="button" data-go="hunt"><span class="ico">✦</span>分霊箱ハント</button>
  <button type="button" data-go="games"><span class="ico">♣</span>飲みゲーム</button>
  <button type="button" data-go="paper"><span class="ico">✎</span>予言者新聞</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="core.js" charset="utf-8"></script>
<script src="sync.js" charset="utf-8"></script>
<script src="hunt.js" charset="utf-8"></script>
<script src="games.js" charset="utf-8"></script>
<script src="paper.js" charset="utf-8"></script>
<script>HP.start();</script>

</body></html>
